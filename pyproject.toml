[project]
name = "proteinwork"
version = "0.2.0"
description = "Validated protein sampling and constrained research candidate libraries"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "jax==0.11.2",
  "thrml==0.1.4",
  "arviz-stats==1.3.3",
  "scikit-learn==1.9.1",
]

[project.scripts]
proteinwork = "proteinwork.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proteinwork*"]
